<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noolukettu 2026 | Master Integrated Console</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%); font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        .safe-area-bottom { padding-bottom: 150px; }
        .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.3); }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .done-card { background: linear-gradient(to right, #f0fdf4, #ffffff); border-left: 8px solid #10b981 !important; }
        .father-pill { background-color: #dbeafe; color: #1e40af; }
        .mother-pill { background-color: #fce7f3; color: #9d174d; }
        .guest-checked { background-color: #f0fdf4; border-left-color: #10b981 !important; }
        .pulse-live { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .4; } }
        #bill-modal { background: rgba(0,0,0,0.95); }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="safe-area-bottom">

    <div class="sticky top-0 z-50 glass p-4">
        <div class="flex justify-between items-center mb-4">
            <div>
                <h1 class="text-xl font-extrabold text-slate-800 tracking-tight uppercase leading-none">Noolukettu 2026</h1>
                <p class="text-[10px] font-bold text-indigo-500 uppercase tracking-widest mt-1">Feb 22 • Master Execution</p>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="requestNotif()" class="bg-white p-2 rounded-xl border border-indigo-100 text-indigo-400 shadow-sm">
                    <i data-lucide="bell" id="notif-icon" class="w-4 h-4"></i>
                </button>
                <div class="flex items-center space-x-2 bg-indigo-600 text-white px-3 py-1.5 rounded-2xl shadow-lg">
                    <i data-lucide="users" class="w-3 h-3 pulse-live"></i>
                    <span id="header-headcount" class="text-xs font-bold">0</span>
                </div>
            </div>
        </div>
        
        <div class="grid grid-cols-3 gap-2 mb-2 text-center">
            <div class="bg-white p-2 rounded-xl border border-slate-100"><p class="text-[7px] font-bold text-slate-400 uppercase">Budget</p><p id="grand-est" class="text-xs font-bold text-slate-700">₹0</p></div>
            <div class="bg-indigo-50 p-2 rounded-xl border border-indigo-100"><p class="text-[7px] font-bold text-indigo-400 uppercase">Spent</p><p id="grand-act" class="text-xs font-black text-indigo-700">₹0</p></div>
            <div class="bg-green-50 p-2 rounded-xl border border-green-100"><p class="text-[7px] font-bold text-green-500 uppercase">Savings</p><p id="total-savings" class="text-xs font-black text-green-600">₹0</p></div>
        </div>
        <div class="w-full bg-slate-100 h-1 rounded-full overflow-hidden"><div id="budget-progress" class="bg-indigo-600 h-full transition-all duration-1000 w-0"></div></div>
    </div>

    <main id="app" class="p-4 max-w-xl mx-auto">
        <div id="view-dashboard" class="space-y-3">
            <div id="category-cards" class="grid grid-cols-1 gap-3"></div>
        </div>

        <div id="view-detail" class="hidden">
            <div class="flex items-center justify-between mb-6">
                <button onclick="showView('dashboard')" class="bg-white p-2 rounded-xl border border-slate-200"><i data-lucide="chevron-left" class="w-5 h-5 text-slate-600"></i></button>
                <div class="flex gap-2">
                    <button onclick="editTopicInfo()" class="bg-slate-100 text-slate-600 p-2 rounded-xl border border-slate-200"><i data-lucide="edit-3" class="w-5 h-5"></i></button>
                    <button onclick="toggleStatus()" id="status-btn" class="text-[10px] px-4 py-2 rounded-xl font-bold uppercase shadow-sm"></button>
                </div>
            </div>
            
            <h2 id="detail-title" class="text-3xl font-extrabold text-slate-800 uppercase leading-tight mb-2"></h2>
            <div class="inline-flex items-center text-[10px] text-indigo-600 font-bold uppercase bg-white px-3 py-1.5 rounded-full border border-indigo-100 shadow-sm mb-8">
                <i data-lucide="shield-check" class="w-3 h-3 mr-1.5"></i> Lead: <span id="detail-assignee" class="ml-1"></span>
            </div>
            
            <div id="items-list" class="space-y-4 mb-8"></div>
            
            <div class="pt-8 border-t border-slate-200">
                <label class="text-[10px] font-black text-slate-400 uppercase flex items-center mb-3 tracking-widest"><i data-lucide="map-pin" class="w-3 h-3 mr-1.5"></i> Logistics & Shop Info</label>
                <textarea id="cat-notes" onchange="updateNotes(this.value)" class="w-full h-32 p-4 bg-yellow-50/30 border border-yellow-100 rounded-2xl text-sm italic focus:ring-2 focus:ring-indigo-200 focus:outline-none transition-all"></textarea>
            </div>

            <button onclick="addItem()" class="mt-8 w-full bg-slate-800 text-white p-4 rounded-xl font-bold shadow-xl active:scale-95 transition-transform flex items-center justify-center">
                <i data-lucide="plus-circle" class="w-5 h-5 mr-2"></i> Add Line Item
            </button>
        </div>
    </main>

    <div id="bill-modal" class="fixed inset-0 z-[100] hidden flex flex-col items-center justify-center p-6">
        <button onclick="closeBill()" class="absolute top-8 right-8 text-white bg-white/20 p-3 rounded-full"><i data-lucide="x"></i></button>
        <img id="bill-img-preview" class="max-w-full max-h-[70vh] rounded-2xl shadow-2xl border-2 border-white/10">
        <button onclick="removeBill()" class="mt-8 bg-red-500 text-white px-8 py-3 rounded-2xl font-bold text-sm shadow-xl uppercase">Delete Bill Image</button>
    </div>

    <nav class="fixed bottom-6 left-4 right-4 glass rounded-3xl p-4 flex justify-around items-center card-shadow z-50">
        <button onclick="showView('dashboard')" class="text-indigo-600 flex flex-col items-center"><i data-lucide="home"></i><span class="text-[8px] font-bold mt-1">HOME</span></button>
        <label class="text-slate-400 flex flex-col items-center cursor-pointer"><i data-lucide="upload-cloud"></i><span class="text-[8px] font-bold mt-1 uppercase">Restore</span><input type="file" id="json-restore" accept=".json" class="hidden" onchange="restoreData(this)"></label>
        <label class="text-slate-400 flex flex-col items-center cursor-pointer"><i data-lucide="file-up"></i><span class="text-[8px] font-bold mt-1 uppercase">CSV Sync</span><input type="file" id="csv-input" accept=".csv" class="hidden" onchange="handleCSV(this)"></label>
        <button onclick="exportJSON()" class="text-slate-400 flex flex-col items-center"><i data-lucide="download"></i><span class="text-[8px] font-bold mt-1">BACKUP</span></button>
        <button onclick="resetData()" class="text-red-300 flex flex-col items-center"><i data-lucide="refresh-cw"></i><span class="text-[8px] font-bold mt-1">RESET</span></button>
    </nav>

    <script>
        const initialData = [
            { id: 'c1', name: "1. Rentals & Vessels", assignee: "Meeran", completed: false, isGuest: false, items: [
                { name: "Pandal Setup", est: 8000, act: 0, p: "" },
                { name: "Plastic Chairs (220)", est: 1760, act: 0, p: "" },
                { name: "Gas Stove & Cylinder", est: 2750, act: 0, p: "" },
                { name: "Vessels & Labor Mix", est: 5440, act: 0, p: "" }
            ]},
            { id: 'c2', name: "2. Grocery & Produce", assignee: "Father", completed: false, isGuest: false, items: [
                { name: "Rice (Khaima 30kg)", est: 3600, act: 0, p: "" },
                { name: "Oils & Ghee", est: 1850, act: 0, p: "" },
                { name: "Provisions & Vegetables", est: 7550, act: 0, p: "" }
            ]},
            { id: 'c3', name: "3. Fresh Food", assignee: "Self", completed: false, isGuest: false, items: [
                { name: "Chicken Meat (50kg)", est: 12000, act: 0, p: "" },
                { name: "King Fish (10kg)", est: 8000, act: 0, p: "" },
                { name: "Milk & Curd", est: 2500, act: 0, p: "" }
            ]},
            { id: 'c4', name: "4. Logistics & Rituals", assignee: "Self", completed: false, isGuest: false, items: [
                { name: "Gold Aranjanam", est: 65000, act: 65000, p: "Settled" },
                { name: "Transport & Dress", est: 29500, act: 0, p: "" },
                { name: "Cook & Helper Labor", est: 10000, act: 0, p: "" },
                { name: "Photo & Decor", est: 6500, act: 0, p: "" }
            ]},
            { id: 'c5', name: "5. Snacks & Others", assignee: "Self", completed: false, isGuest: false, items: [
                { name: "Halwa (30kg)", est: 6000, act: 0, p: "" },
                { name: "Uzhunnu Vada (300 Nos)", est: 2400, act: 0, p: "" },
                { name: "Banana/Leaf/Tea/Cups", est: 2900, act: 0, p: "" }
            ]},
            { id: 'c6', name: "6. Guest List", assignee: "Family", completed: false, isGuest: true, items: [
                { name: "Sample Invite", count: 4, side: "Father", arrived: false }
            ]}
        ];

        let state = JSON.parse(localStorage.getItem('nk_master_v20')) || initialData;
        let activeId = null; let activeIdx = null;

        function save() { localStorage.setItem('nk_master_v20', JSON.stringify(state)); render(); }

        function render() {
            const container = document.getElementById('category-cards'); container.innerHTML = '';
            let gEst = 0, gAct = 0, gHead = 0;

            state.forEach(cat => {
                const cEst = cat.isGuest ? 0 : cat.items.reduce((s, i) => s + (Number(i.est)||0), 0);
                const cAct = cat.isGuest ? 0 : cat.items.reduce((s, i) => s + (Number(i.act)||0), 0);
                gEst += cEst; gAct += cAct;
                if(cat.isGuest) gHead = cat.items.reduce((s, i) => s + (Number(i.count)||0), 0);

                const assignedCount = cat.items.filter(i => i.p && i.p.trim() !== "").length;
                const unassignedCount = cat.items.length - assignedCount;

                const card = document.createElement('div');
                card.className = `bg-white p-5 rounded-3xl border border-slate-100 card-shadow flex justify-between items-center transition-all active:scale-[0.98] ${cat.completed ? 'done-card' : ''}`;
                card.onclick = () => openCategory(cat.id);
                
                let stats = cat.isGuest ? 
                    `<div class="text-indigo-600 font-extrabold text-sm">${cat.items.filter(i=>i.arrived).reduce((s,i)=>s+Number(i.count),0)}/${gHead}</div>` :
                    `<div class="text-indigo-600 font-extrabold text-sm">₹${cAct.toLocaleString()}</div>`;

                card.innerHTML = `<div class="flex items-center space-x-4 truncate"><div class="w-12 h-12 rounded-2xl ${cat.completed?'bg-green-100 text-green-600':'bg-indigo-50 text-indigo-600'} flex-shrink-0 flex items-center justify-center"><i data-lucide="${cat.isGuest?'users':'package'}"></i></div><div class="truncate"><div class="text-sm font-extrabold text-slate-800 uppercase truncate">${cat.name}</div><div class="flex flex-wrap gap-1 mt-0.5 items-center"><span class="text-[9px] text-slate-400 font-bold uppercase truncate max-w-[60px]">👤 ${cat.assignee}</span><span class="text-[8px] bg-indigo-50 text-indigo-400 px-1.5 py-0.5 rounded font-black uppercase">${cat.items.length} TOTAL</span><span class="text-[8px] bg-green-50 text-green-500 px-1.5 py-0.5 rounded font-black uppercase">${assignedCount} OK</span>${unassignedCount > 0 ? `<span class="text-[8px] bg-red-50 text-red-400 px-1.5 py-0.5 rounded font-black uppercase">${unassignedCount} NO</span>` : ''}</div></div></div><div class="text-right flex-shrink-0 ml-2 leading-none">${stats}</div>`;
                container.appendChild(card);
            });
            document.getElementById('header-headcount').innerText = gHead;
            document.getElementById('grand-est').innerText = `₹${gEst.toLocaleString()}`;
            document.getElementById('grand-act').innerText = `₹${gAct.toLocaleString()}`;
            document.getElementById('total-savings').innerText = `₹${(gEst - gAct > 0 ? gEst - gAct : 0).toLocaleString()}`;
            document.getElementById('budget-progress').style.width = `${(gAct/gEst)*100}%`;
            lucide.createIcons();
        }

        function openCategory(id) {
            activeId = id; const cat = state.find(c => c.id === id);
            document.getElementById('detail-title').innerText = cat.name;
            document.getElementById('detail-assignee').innerText = cat.assignee;
            document.getElementById('cat-notes').value = cat.notes || "";
            const sBtn = document.getElementById('status-btn');
            sBtn.innerHTML = cat.completed ? '<i data-lucide="check" class="w-3 h-3 mr-2"></i> Settled' : 'Mark Completed';
            sBtn.className = cat.completed ? 'bg-green-500 text-white px-4 py-2 rounded-xl shadow-md' : 'bg-slate-100 text-slate-400 px-4 py-2 rounded-xl';
            const list = document.getElementById('items-list'); list.innerHTML = '';
            
            cat.items.forEach((item, idx) => {
                const div = document.createElement('div');
                if(cat.isGuest) {
                    div.className = `p-5 rounded-3xl border border-slate-100 shadow-sm flex flex-col space-y-3 ${item.arrived ? 'guest-checked bg-green-50' : 'bg-white'}`;
                    div.innerHTML = `<div class="flex justify-between items-center"><span class="text-sm font-extrabold uppercase text-slate-800">${item.name}</span><button onclick="toggleGuestArrival(${idx})" class="w-8 h-8 rounded-xl border-2 flex items-center justify-center ${item.arrived?'bg-green-500 border-green-500 text-white':'bg-white border-slate-200'}">${item.arrived?'<i data-lucide="check"></i>':''}</button></div><div class="flex justify-between items-center"><div class="flex space-x-1"><span onclick="updItem(${idx},'side','Father')" class="father-pill px-2 py-0.5 rounded-full text-[8px] font-bold cursor-pointer ${item.side==='Father'?'ring-1 ring-indigo-600':'opacity-40'}">FATHER</span><span onclick="updItem(${idx},'side','Mother')" class="mother-pill px-2 py-0.5 rounded-full text-[8px] font-bold cursor-pointer ${item.side==='Mother'?'ring-1 ring-pink-600':'opacity-40'}">MOTHER</span></div><div class="bg-slate-50 border border-slate-200 rounded px-2 flex items-center"><span class="text-[8px] font-bold text-slate-300 mr-2 uppercase">Head:</span><input type="number" value="${item.count}" onchange="updItem(${idx},'count',this.value)" class="bg-transparent w-8 text-xs font-black text-indigo-700 focus:outline-none text-center"></div><button onclick="deleteItem(${idx})" class="text-slate-200"><i data-lucide="trash-2"></i></button></div>`;
                } else {
                    div.className = "bg-white p-5 rounded-3xl border border-slate-100 card-shadow space-y-4";
                    const isOver = item.act > item.est && item.est > 0;
                    div.innerHTML = `<div class="flex justify-between items-center"><span class="text-xs font-extrabold uppercase text-slate-800">${item.name}</span><div class="flex space-x-3"><button onclick="triggerUpload(${idx})" class="${item.bill?'text-indigo-600':'text-slate-200'}"><i data-lucide="receipt"></i></button><button onclick="deleteItem(${idx})" class="text-slate-200"><i data-lucide="x"></i></button></div></div><div class="grid grid-cols-2 gap-4"><div class="bg-slate-50 p-3 rounded-2xl"><label class="text-[7px] font-black text-slate-400 uppercase italic">Est</label><input type="number" value="${item.est}" onchange="updItem(${idx},'est',this.value)" class="bg-transparent w-full text-sm font-bold text-slate-700 focus:outline-none"></div><div class="bg-indigo-50 p-3 rounded-2xl"><label class="text-[7px] font-black text-indigo-400 uppercase italic">Paid</label><input type="number" value="${item.act}" onchange="updItem(${idx},'act',this.value)" class="bg-transparent w-full text-sm font-black ${isOver?'text-red-500':'text-indigo-700'} focus:outline-none"></div></div><div class="bg-slate-50 flex items-center px-3 py-2 rounded-xl"><i data-lucide="user" class="w-3 h-3 text-slate-300 mr-2"></i><input type="text" value="${item.p||''}" onchange="updItem(${idx},'p',this.value)" placeholder="Assign to person..." class="bg-transparent w-full text-[10px] font-bold text-indigo-600 focus:outline-none placeholder:text-slate-300"></div>${item.bill?`<button onclick="viewBill(${idx})" class="text-[10px] font-black text-indigo-600 underline">View Receipt Image</button>`:''}<input type="file" id="file-${idx}" class="hidden" accept="image/*" onchange="handleBill(this, ${idx})">`;
                }
                list.appendChild(div);
            });
            showView('detail'); lucide.createIcons();
        }

        // Feature Logic
        function requestNotif() { Notification.requestPermission(); }
        function triggerUpload(idx) { document.getElementById(`file-${idx}`).click(); }
        function handleBill(input, idx) { const r = new FileReader(); r.onload = (e) => { state.find(c => c.id === activeId).items[idx].bill = e.target.result; save(); openCategory(activeId); }; r.readAsDataURL(input.files[0]); }
        function viewBill(idx) { activeIdx = idx; document.getElementById('bill-img-preview').src = state.find(c => c.id === activeId).items[idx].bill; document.getElementById('bill-modal').classList.remove('hidden'); }
        function closeBill() { document.getElementById('bill-modal').classList.add('hidden'); }
        function removeBill() { if(confirm("Delete Receipt?")) { state.find(c => c.id === activeId).items[activeIdx].bill = null; save(); closeBill(); openCategory(activeId); } }
        function toggleGuestArrival(idx) { state.find(c => c.id === activeId).items[idx].arrived = !state.find(c => c.id === activeId).items[idx].arrived; save(); openCategory(activeId); }
        function updItem(idx, f, v) { state.find(c => c.id === activeId).items[idx][f] = (f==='p'||f==='side')?v:Number(v); save(); if(f==='side') openCategory(activeId); }
        function showView(v) { document.getElementById('view-dashboard').classList.toggle('hidden', v !== 'dashboard'); document.getElementById('view-detail').classList.toggle('hidden', v !== 'detail'); window.scrollTo(0,0); }
        function toggleStatus() { const cat = state.find(c => c.id === activeId); cat.completed = !cat.completed; save(); openCategory(activeId); }
        function updateNotes(v) { state.find(c => c.id === activeId).notes = v; save(); }
        function editTopicInfo() { const cat = state.find(c => c.id === activeId); const nN = prompt("New Name:", cat.name); const nL = prompt("Lead Person:", cat.assignee); if(nN) cat.name = nN; if(nL) cat.assignee = nL; save(); openCategory(activeId); }
        function addItem() { const cat = state.find(c => c.id === activeId); const n = prompt(cat.isGuest?"Guest:":"Item:"); if(n) { if(cat.isGuest) cat.items.push({ id: Date.now(), name: n, count: 1, side: "Father", arrived: false }); else cat.items.push({ id: Date.now(), name: n, est: 0, act: 0, p: "", bill: null }); save(); openCategory(activeId); } }
        function addTopic() { const n = prompt("Heading Name:"); if(n) { state.push({ id: 'c_'+Date.now(), name: n, assignee: "Unassigned", completed: false, isGuest: n.toLowerCase().includes("guest"), notes: "", items: [] }); save(); } }
        function exportJSON() { const a = document.createElement('a'); a.href = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state)); a.download = "nk_backup.json"; a.click(); }
        function restoreData(input) { const r = new FileReader(); r.onload = (e) => { state = JSON.parse(e.target.result); save(); alert("Restored!"); }; r.readAsText(input.files[0]); }
        function resetData() { if(confirm("Clear All?")) { state = initialData; save(); } }
        function handleCSV(input) {
            const r = new FileReader(); r.onload = (e) => {
                const rows = e.target.result.split('\n').slice(1); const newData = [];
                rows.forEach(row => {
                    const c = row.split(',');
                    if (c.length >= 4) {
                        const cn = c[0].trim(); let cat = newData.find(cat => cat.name === cn);
                        if (!cat) cat = { id: 'c_'+Math.random(), name: cn, assignee: c[4]||"Unassigned", completed: false, isGuest: cn.toLowerCase().includes("guest"), notes: "", items: [] };
                        newData.push(cat);
                        if(cat.isGuest) cat.items.push({ id: Math.random(), name: c[1].trim(), count: Number(c[2])||1, side: c[5]||"Father", arrived: false });
                        else cat.items.push({ id: Math.random(), name: c[1].trim(), est: Number(c[2])||0, act: Number(c[3])||0, p: c[5]||"", bill: null });
                    }
                });
                if(newData.length > 0) { state = newData; save(); alert("Sync Done!"); }
            }; r.readAsText(input.files[0]);
        }
        render();
    </script>
</body>
</html>
